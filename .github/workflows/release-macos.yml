name: Release macOS
# Re-runs only the macOS build and adds it to the existing release v<VERSION>.
# Use it when the macOS runner was unavailable during the main release run.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: '1.24'
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./... && go test ./...
      - run: ./scripts/build.sh
      - name: Add to the release and refresh checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/add-to-release.sh
