name: Release macOS
# Re-runs only the macOS build and adds it to the existing release v<VERSION>.
# Use it when the macOS runner was unavailable during the main release run.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GO_VERSION: '1.24'
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./... && go test ./...
      - run: ./scripts/build.sh
      - name: Add to the release and refresh checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/add-to-release.sh
