name: Release
# Versioned releases. The version comes from the VERSION file in the repo root
# (e.g. 0.0.2-alpha). Every push to main builds the native app on each OS and
# publishes release v<VERSION>; a version containing "-" (alpha/beta/rc) is
# marked as a pre-release. Re-pushing the same version replaces that release
# (tag and files); bump VERSION to publish a new one. Each OS builds on its own
# runner (the GUI needs CGO), so a slow runner never blocks the others.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev zip
      - name: Windows exe icon and version info
        if: runner.os == 'Windows'
        continue-on-error: true   # without it the exe is still built, just with the default icon
        run: platforms/windows/winres/make-resources.sh
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dd-installer-${{ matrix.name }}
          path: dist/*
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dd-installer-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && ls && sha256sum * > SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          PRE=""; case "$V" in *-*) PRE="--prerelease" ;; esac
          # one-time cleanup of the old rolling release
          gh release delete latest --cleanup-tag --yes || true
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" $PRE \
            --title "DD-Installer $V" \
            --notes "DD-Installer $V (commit $GITHUB_SHA). Early alpha: not code-signed, not yet tested on real Windows/macOS machines. Read the disclaimer in the archive (no credentials are stored; no liability of RedBlink or Prophet). Verify downloads with SHA256SUMS. A missing file means that OS runner did not finish - re-run the workflow."
