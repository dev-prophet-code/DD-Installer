name: Release
# Versioned releases. The version comes from the VERSION file (e.g. 0.0.4-alpha).
# Every push to main builds the native app on each OS and publishes/updates the
# release v<VERSION>; a version containing "-" (alpha/beta/rc) is a pre-release.
# Notes come from CHANGELOG.md. Each OS builds on its own runner (the GUI needs
# CGO), so a slow runner never blocks the others; a missing OS can be added
# later with the "Release macOS" workflow without touching the rest.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write      # build provenance attestation
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  GO_VERSION: '1.24'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-14          # Apple Silicon runner; builds arm64 and amd64
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev zip
      - name: Windows exe icon and version info
        if: runner.os == 'Windows'
        continue-on-error: true   # without it the exe is still built, just with the default icon
        run: platforms/windows/winres/make-resources.sh
      - run: go vet ./... && go test ./...
      - name: Build
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dd-installer-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dd-installer-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && ls && sha256sum * > SHA256SUMS
      - name: Provenance attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'
      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh > notes.md && cat notes.md
      - name: Publish or update the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh
