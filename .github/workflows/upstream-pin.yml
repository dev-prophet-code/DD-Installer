name: Upstream manifest
# Keeps upstream/upstream.json current: once a day (and on demand) the newest
# Dune Docker release is downloaded, its files are hashed and the result is
# written to the "latest" entry. DD-Installer reads this list before every
# download, so a new upstream release does not need a new DD-Installer build.
# The "tested" entry is NEVER changed here; it is updated by hand with
#   go run ./cmd/pin-upstream -tag vX.Y.Z -tested
# after the release has been checked with DD-Installer.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upstream-manifest
  cancel-in-progress: false
env:
  GO_VERSION: '1.26'
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Hash the newest upstream release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/pin-upstream -latest
      - name: Commit the manifest when it changed
        run: |
          if git diff --quiet -- upstream/upstream.json; then
            echo "Manifest is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/upstream.json
          git commit -m "Upstream manifest: record newest Dune Docker release"
          git push origin HEAD:main
